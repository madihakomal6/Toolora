<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Grammar Checker + Humanizer - Toolora</title>
  <meta name="description" content="Free AI Grammar Checker and AI Text Humanizer. Fix grammar mistakes and convert AI text to human writing instantly.">
  <style>
    *{margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif}
    body{
      background: linear-gradient(-45deg, #667eea, #764ba2, #6B8CE3, #8A2BE2);
      background-size: 400% 400%;
      animation: gradient 15s ease infinite;
      min-height:100vh; color:#fff; padding:40px 20px
    }
    @keyframes gradient {0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
    
    .back-btn{
      display:inline-block; margin-bottom:20px; color:#fff; text-decoration:none; 
      background:rgba(255,255,255,0.2); padding:10px 20px; border-radius:50px; transition:0.3s
    }
    .back-btn:hover{background:rgba(255,255,255,0.3)}
    
    .container{
      max-width:900px; margin:0 auto; background:rgba(255,255,255,0.1); 
      backdrop-filter:blur(12px); padding:30px; border-radius:20px; border:1px solid rgba(255,255,255,0.2)
    }
    
    h1{text-align:center; margin-bottom:10px; font-size:2.2rem}
    p.subtitle{text-align:center; opacity:0.9; margin-bottom:30px; font-size:1.1rem}
    
    textarea{
      width:100%; height:200px; padding:15px; border-radius:10px; border:none; 
      font-size:1.1rem; margin-bottom:20px; outline:none; color:#000; resize:vertical
    }
    
    .btns{display:grid; grid-template-columns:1fr 1fr 1fr; gap:15px; margin-bottom:20px}
    button{
      padding:15px; border:none; border-radius:10px; background:#fff; color:#764ba2; 
      font-size:1rem; font-weight:700; cursor:pointer; transition:0.3s
    }
    button:hover{transform:translateY(-2px); background:#f0f0f0}
    
    #output{
      background:#111; color:#0f0; padding:20px; border-radius:10px; 
      margin-top:20px; min-height:200px; white-space:pre-wrap; font-size:1.1rem; line-height:1.6
    }
    
    .stats{display:flex; justify-content:space-between; margin-top:10px; font-size:0.9rem; opacity:0.8}
    
    @media(max-width:768px){.btns{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <a href="/" class="back-btn">← Back to Home</a>
  
  <div class="container">
    <h1>✍️ AI Grammar + Humanizer Tool</h1>
    <p class="subtitle">Fix Grammar Mistakes & Convert AI Text to 100% Human Writing</p>
    
    <textarea id="input" placeholder="Paste your AI text here... Example: Furthermore, i am utilizing this tool. it are very good."></textarea>
    
    <div class="btns">
      <button id="btnGrammar">1. Fix Grammar</button>
      <button id="btnHuman">2. Humanize AI</button>
      <button id="btnBoth">3. Do Both 🔥</button>
    </div>
    
    <div id="output">Your result will appear here...</div>
    
    <div class="stats">
      <span id="wordCount">Words: 0</span>
      <span id="charCount">Characters: 0</span>
    </div>
  </div>

  <script>
    const input = document.getElementById('input');
    const output = document.getElementById('output');

    // Word and Character Counter
    input.addEventListener('input', function() {
      let text = this.value;
      let words = text.trim().split(/\s+/).filter(Boolean).length;
      document.getElementById('wordCount').innerText = 'Words: ' + words;
      document.getElementById('charCount').innerText = 'Characters: ' + text.length;
    });

    // Button Clicks
    document.getElementById('btnGrammar').addEventListener('click', checkGrammar);
    document.getElementById('btnHuman').addEventListener('click', paraphrase);
    document.getElementById('btnBoth').addEventListener('click', doBoth);

    function checkGrammar() {
      let text = input.value;
      if(text.trim() === '') {alert('Please paste some text first'); return;}
      
      let fixed = text;
      fixed = fixed.replace(/\bi\b/g, 'I');
      fixed = fixed.replace(/\bi'm\b/g, "I'm");
      fixed = fixed.replace(/they is/g, 'they are');
      fixed = fixed.replace(/he are/g, 'he is');
      fixed = fixed.replace(/she are/g, 'she is');
      fixed = fixed.replace(/  +/g, ' ); 
      fixed = fixed.replace(/\. +/g, '. ');
      fixed = fixed.charAt(0).toUpperCase() + fixed.slice(1);

      output.innerText = "✅ Grammar Fixed Version:\n\n" + fixed;
    }
    
    function paraphrase() {
      let text = input.value;
      if(text.trim() === '') {alert('Please paste some text first'); return;}
      
      let human = text;
      const replacements = {
        'Furthermore': 'Also', 'Moreover': 'Plus', 'In conclusion': 'So',
        'Utilize': 'Use', 'Therefore': 'So', 'However,': 'But',
        'Additionally': 'Also', 'Subsequently': 'Then', 'Implement': 'Do'
      };
      
      for(let [ai, humanWord] of Object.entries(replacements)) {
        human = human.replace(new RegExp(ai, 'g'), humanWord);
      }
      human = human.replace(/  +/g, ' ); 

      output.innerText = "🤖 Humanized Version:\n\n" + human;
    }

    function doBoth() {
      let text = input.value;
      if(text.trim() === '') {alert('Please paste some text first'); return;}
      
      let result = text;
      // Step 1: Grammar
      result = result.replace(/\bi\b/g, 'I');
      result = result.replace(/they is/g, 'they are');
      result = result.replace(/he are/g, 'he is');
      // Step 2: Humanize
      result = result.replace(/Furthermore/g, 'Also');
      result = result.replace(/Utilize/g, 'Use');
      result = result.replace(/Therefore/g, 'So');
      result = result.replace(/  +/g, ' ); 
      result = result.charAt(0).toUpperCase() + result.slice(1);

      output.innerText = "🔥 Final Pro Version:\n\n" + result + "\n\nNote: Edited for both Grammar + Human Touch";
    }
  </script>
</body>
</html>
