<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image to JPG Converter - Toolora</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <header>
        <h1>Image to JPG Converter</h1>
        <a href="/">← Back to Home</a>
    </header>

    <div class="container">
        <h2>PNG, WEBP ko JPG me Convert Karo</h2>
        <input type="file" id="image" accept="image/*">
        <br><br>
        <canvas id="canvas" style="display:none;"></canvas>
        <img id="preview" src="" style="max-width:300px; display:none;">
        <br>
        <button onclick="convert()">Convert to JPG</button>
        <a id="download" href="#" download="converted.jpg" style="display:none;">Download JPG</a>
        <p id="msg"></p>
    </div>

    <footer>
        <p>© 2026 Toolora. Made with ❤️</p>
    </footer>

    <script async="async" data-cfasync="false" src="https://pl30981924.profitableratecpmnetwork.com/3684f4319d8cea1f9e2a95e40ca25cef/invoke.js"></script>
    <div id="container-3684f4319d8cea1f9e2a95e40ca25cef"></div>

    <script>
        let img = new Image();

        document.getElementById("image").onchange = function(e){
            let file = e.target.files[0];
            let reader = new FileReader();
            reader.onload = function(event){
                img.src = event.target.result;
                document.getElementById("preview").src = event.target.result;
                document.getElementById("preview").style.display = "block";
            }
            reader.readAsDataURL(file);
        }

        function convert(){
            if(!img.src){
                alert("Please select an image first");
                return;
            }

            let canvas = document.getElementById("canvas");
            let ctx = canvas.getContext("2d");

            canvas.width = img.width;
            canvas.height = img.height;
            ctx.drawImage(img, 0, 0);

            let jpg = canvas.toDataURL("image/jpeg", 0.9);
            document.getElementById("download").href = jpg;
            document.getElementById("download").style.display = "inline-block";
            document.getElementById("msg").innerText = "Converted! Click Download";
        }
    </script>

</body>
</html>
