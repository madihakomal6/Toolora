<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image to JPG Converter - Toolora</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">
<div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md text-center">
  <h1 class="text-2xl font-bold mb-2">Image to JPG Converter</h1>
  <p class="text-gray-500 mb-6">PNG, WEBP ko JPG me convert karo</p>
  
  <input type="file" id="imageInput" accept="image/*" class="mb-4 w-full border p-2 rounded">
  <button onclick="convertToJPG()" class="bg-black text-white px-6 py-3 rounded-lg w-full font-semibold">Convert & Download</button>
  
  <a href="/" class="block mt-6 text-blue-500">← Back to Home</a>
</div>

<script>
function convertToJPG() {
  const file = document.getElementById('imageInput').files[0];
  if (!file) return alert('Pehle image select karo!');
  
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      canvas.width = img.width;
      canvas.height = img.height;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = "#FFFFFF";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0);
      const jpg = canvas.toDataURL('image/jpeg', 0.9);
      
      const a = document.createElement('a');
      a.href = jpg;
      a.download = 'converted-toolora.jpg';
      a.click();
    }
    img.src = e.target.result;
  }
  reader.readAsDataURL(file);
}
</script>
</body>
  </html>
