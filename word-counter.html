<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Counter - Toolora</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <header>
        <h1>Word Counter</h1>
        <a href="/">← Back to Home</a>
    </header>

    <div class="container">
        <h2>Words aur Characters Count Karo</h2>
        <textarea id="text" rows="10" placeholder="Yahan text paste karo"></textarea>
        <p>Words: <span id="words">0</span></p>
        <p>Characters: <span id="chars">0</span></p>
    </div>

    <footer>
        <p>© 2026 Toolora. Made with ❤️</p>
    </footer>

    <script async="async" data-cfasync="false" src="https://pl30981924.profitableratecpmnetwork.com/3684f4319d8cea1f9e2a95e40ca25cef/invoke.js"></script>
    <div id="container-3684f4319d8cea1f9e2a95e40ca25cef"></div>

    <script>
        document.getElementById("text").oninput = function() {
            let txt = this.value;
            document.getElementById("words").innerText = txt.trim().split(/\s+/).filter(Boolean).length;
            document.getElementById("chars").innerText = txt.length;
        }
    </script>

</body>
</html>
