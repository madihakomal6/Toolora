<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Counter - Toolora</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <header>
        <h1>Word Counter</h1>
        <a href="/">← Back to Home</a>
    </header>

    <div class="container">
        <h2>Words aur Characters Count Karo</h2>
        <textarea id="text" rows="10" placeholder="Yahan text paste karo ya likho"></textarea>
        <div class="result-box">
            <p><b>Words:</b> <span id="words">0</span></p>
            <p><b>Characters:</b> <span id="chars">0</span></p>
            <p><b>Characters without space:</b> <span id="charsNoSpace">0</span></p>
            <p><b>Paragraphs:</b> <span id="para">0</span></p>
        </div>
    </div>

    <footer>
        <p>© 2026 Toolora. Made with ❤️</p>
    </footer>

    <script async="async" data-cfasync="false" src="https://pl30981924.profitableratecpmnetwork.com/3684f4319d8cea1f9e2a95e40ca25cef/invoke.js"></script>
    <div id="container-3684f4319d8cea1f9e2a95e40ca25cef"></div>

    <script>
        document.getElementById("text").oninput = function() {
            let txt = this.value;
            
            // Words count
            let words = txt.trim().split(/\s+/).filter(Boolean).length;
            document.getElementById("words").innerText = words;
            
            // Characters count
            document.getElementById("chars").innerText = txt.length;
            
            // Characters without space
            document.getElementById("charsNoSpace").innerText = txt.replace(/\s/g, '').length;
            
            // Paragraphs count
            let para = txt.split(/\n+/).filter(Boolean).length;
            document.getElementById("para").innerText = para;
        }
    </script>

</body>
</html>
