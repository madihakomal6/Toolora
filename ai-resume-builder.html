<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Resume Builder - Toolora</title>
  <style>
    *{margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI'}
    body{background: linear-gradient(-45deg, #667eea, #764ba2); min-height:100vh; color:#fff; padding:40px 20px}
    .back-btn{display:inline-block; margin-bottom:20px; color:#fff; text-decoration:none; background:rgba(255,255,255,0.2); padding:10px 20px; border-radius:50px}
    .container{max-width:1000px; margin:0 auto; display:grid; grid-template-columns:1fr 1fr; gap:30px}
    .form-box, .preview-box{background:rgba(255,255,255,0.1); backdrop-filter:blur(12px); padding:30px; border-radius:20px; border:1px solid rgba(255,255,255,0.2)}
    h1{grid-column:1/3; text-align:center; margin-bottom:10px}
    p.subtitle{grid-column:1/3; text-align:center; opacity:0.8; margin-bottom:20px}
    input, textarea{width:100%; padding:12px; border-radius:8px; border:none; margin-bottom:15px; font-size:1rem; outline:none}
    label{font-weight:600; margin-bottom:5px; display:block}
    button{width:100%; padding:15px; border:none; border-radius:10px; background:#fff; color:#764ba2; font-size:1.2rem; font-weight:700; cursor:pointer; transition:0.3s}
    button:hover{transform:scale(1.02)}
    .preview-box{background:#fff; color:#000}
    .preview-box h2{color:#667eea}
    .preview-box hr{margin:15px 0; border:none; border-top:2px solid #eee}
    @media(max-width:768px){.container{grid-template-columns:1fr} h1{grid-column:1/2}}
  </style>
</head>
<body>
  <a href="/" class="back-btn">← Back to Home</a>
  <div class="container">
    <h1>🤖 AI Resume Builder</h1>
    <p class="subtitle">Create Professional Resume in 60 Seconds. 100% Free</p>
    
    <div class="form-box">
      <h3>Enter Your Details</h3>
      <label>Full Name</label>
      <input id="name" placeholder="John Doe">
      <label>Job Title</label>
      <input id="job" placeholder="Web Developer">
      <label>Email</label>
      <input id="email" placeholder="john@email.com">
      <label>Phone</label>
      <input id="phone" placeholder="+92 3XX XXXXXXX">
      <label>Skills</label>
      <textarea id="skills" placeholder="HTML, CSS, JavaScript, React" rows="3"></textarea>
      <label>Experience</label>
      <textarea id="exp" placeholder="Company Name - Role - Years" rows="3"></textarea>
      <label>Education</label>
      <textarea id="edu" placeholder="Degree - University - Year" rows="2"></textarea>
      <button onclick="generate()">Generate Resume</button>
    </div>

    <div class="preview-box" id="preview">
      <h3>Your Resume Preview</h3>
      <p>Fill the form and click generate</p>
    </div>
  </div>

  <script>
    function generate() {
      let name = document.getElementById('name').value || 'Your Name';
      let job = document.getElementById('job').value || 'Job Title';
      let email = document.getElementById('email').value;
      let phone = document.getElementById('phone').value;
      let skills = document.getElementById('skills').value;
      let exp = document.getElementById('exp').value;
      let edu = document.getElementById('edu').value;
      
      let resume = `
        <h2>${name}</h2>
        <h4 style="color:#667eea">${job}</h4>
        <p>${email} | ${phone}</p>
        <hr>
        <h3>Skills</h3>
        <p>${skills}</p>
        <h3>Experience</h3>
        <p>${exp}</p>
        <h3>Education</h3>
        <p>${edu}</p>
        <hr>
        <p style="font-size:12px; text-align:center"><i>Generated by Toolora AI</i></p>
      `;
      document.getElementById('preview').innerHTML = resume;
    }
  </script>
</body>
  </html>
