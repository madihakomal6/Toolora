<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator - Toolora</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <header>
        <h1>BMI Calculator</h1>
        <a href="/">← Back to Home</a>
    </header>

    <div class="container">
        <h2>Apna BMI Check Karo</h2>
        <input type="number" id="weight" placeholder="Weight in KG">
        <input type="number" id="height" placeholder="Height in CM">
        <button onclick="calculateBMI()">Calculate</button>
        <p id="result"></p>
    </div>

    <footer>
        <p>© 2026 Toolora. Made with ❤️</p>
    </footer>

    <script async="async" data-cfasync="false" src="https://pl30981924.profitableratecpmnetwork.com/3684f4319d8cea1f9e2a95e40ca25cef/invoke.js"></script>
    <div id="container-3684f4319d8cea1f9e2a95e40ca25cef"></div>

    <script>
        function calculateBMI() {
            let w = document.getElementById("weight").value;
            let h = document.getElementById("height").value / 100;
            let bmi = (w / (h*h)).toFixed(2);
            document.getElementById("result").innerText = "Your BMI: " + bmi;
        }
    </script>

</body>
</html>
