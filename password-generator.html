<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator - Toolora</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <header>
        <h1>Password Generator</h1>
        <a href="/">← Back to Home</a>
    </header>

    <div class="container">
        <h2>Strong Password Banao</h2>
        
        <label>Password Length: <span id="lenValue">12</span></label>
        <input type="range" id="length" min="4" max="32" value="12" oninput="document.getElementById('lenValue').innerText=this.value">
        
        <label><input type="checkbox" id="uppercase" checked> A-Z</label>
        <label><input type="checkbox" id="lowercase" checked> a-z</label>
        <label><input type="checkbox" id="numbers" checked> 0-9</label>
        <label><input type="checkbox" id="symbols" checked> !@#$</label>
        
        <input type="text" id="password" readonly placeholder="Click Generate">
        <button onclick="generatePassword()">Generate Password</button>
        <button onclick="copyPassword()">Copy</button>
        <p id="msg"></p>
    </div>

    <footer>
        <p>© 2026 Toolora. Made with ❤️</p>
    </footer>

    <script async="async" data-cfasync="false" src="https://pl30981924.profitableratecpmnetwork.com/3684f4319d8cea1f9e2a95e40ca25cef/invoke.js"></script>
    <div id="container-3684f4319d8cea1f9e2a95e40ca25cef"></div>

    <script>
        function generatePassword() {
            let length = document.getElementById("length").value;
            let chars = "";
            
            if(document.getElementById("uppercase").checked) chars += "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            if(document.getElementById("lowercase").checked) chars += "abcdefghijklmnopqrstuvwxyz";
            if(document.getElementById("numbers").checked) chars += "0123456789";
            if(document.getElementById("symbols").checked) chars += "!@#$%^&*()_+-=[]{}|;:,.<>?";
            
            if(chars == ""){
                alert("Please select at least 1 option");
                return;
            }
            
            let pass = "";
            for(let i=0; i<length; i++){
                pass += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            document.getElementById("password").value = pass;
        }
        
        function copyPassword() {
            let pass = document.getElementById("password");
            pass.select();
            document.execCommand("copy");
            document.getElementById("msg").innerText = "Copied!";
            setTimeout(()=>{document.getElementById("msg").innerText = ""}, 2000);
        }
    </script>

</body>
</html>
