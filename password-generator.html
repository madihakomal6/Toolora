<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Password Generator - Toolora</title><style>body{font-family:Arial;background:#f5f5f5;text-align:center;padding:20px}.container{max-width:500px;margin:auto;background:white;padding:30px;border-radius:15px}input{width:90%;padding:12px;margin:10px 0;border:2px solid #667eea;border-radius:8px;font-size:16px}button{background:linear-gradient(135deg, #667eea 0%, #764ba2 100%);color:white;border:none;padding:12px 30px;border-radius:8px;cursor:pointer;font-weight:bold}</style></head><body><div class="container"><h1>🔐 Password Generator</h1><button onclick="genPass()">Generate Strong Password</button><input type="text" id="result" readonly placeholder="Your password will appear here"><br><br><a href="/">← Back to Home</a></div><script>function genPass(){let chars="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*";let pass="";for(let i=0;i<12;i++){pass+=chars.charAt(Math.floor(Math.random()*chars.length))}document.getElementById("result").value=pass;}</script></body></html>
