<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Age Calculator - Toolora</title><style>body{font-family:Arial;background:#f5f5f5;text-align:center;padding:20px}.container{max-width:400px;margin:auto;background:white;padding:30px;border-radius:15px}input{width:90%;padding:12px;margin:10px 0;border:2px solid #667eea;border-radius:8px}button{background:linear-gradient(135deg, #667eea 0%, #764ba2 100%);color:white;border:none;padding:12px 30px;border-radius:8px;cursor:pointer;font-weight:bold}</style></head><body><div class="container"><h1>🎂 Age Calculator</h1><input type="date" id="dob"><br><button onclick="calcAge()">Calculate Age</button><div id="result" style="margin-top:20px;font-weight:bold;"></div><br><a href="/">← Back to Home</a></div><script>function calcAge(){let dob=new Date(document.getElementById("dob").value);let diff=Date.now()-dob.getTime();let age=new Date(diff);document.getElementById("result").innerHTML="Your Age: "+Math.abs(age.getUTCFullYear()-1970)+" Years";}</script></body></html>
