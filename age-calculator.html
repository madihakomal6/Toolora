<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator - Toolora</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <header>
        <h1>Age Calculator</h1>
        <a href="/">← Back to Home</a>
    </header>

    <div class="container">
        <h2>Apni Age Nikalo</h2>
        <input type="date" id="dob">
        <button onclick="calculateAge()">Calculate</button>
        <p id="result"></p>
    </div>

    <footer>
        <p>© 2026 Toolora. Made with ❤️</p>
    </footer>

    <script async="async" data-cfasync="false" src="https://pl30981924.profitableratecpmnetwork.com/3684f4319d8cea1f9e2a95e40ca25cef/invoke.js"></script>
    <div id="container-3684f4319d8cea1f9e2a95e40ca25cef"></div>

    <script>
        function calculateAge() {
            let dob = document.getElementById("dob").value;
            if(dob == ""){
                document.getElementById("result").innerText = "Please select date";
                return;
            }
            let today = new Date();
            let birthDate = new Date(dob);
            let age = today.getFullYear() - birthDate.getFullYear();
            let m = today.getMonth() - birthDate.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) {
                age--;
            }
            document.getElementById("result").innerText = "Your Age: " + age + " Years";
        }
    </script>

</body>
</html>
