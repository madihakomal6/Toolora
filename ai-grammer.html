<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Grammar Checker - Toolora</title>
  <style>
    *{margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI'}
    body{background: linear-gradient(-45deg, #667eea, #764ba2); min-height:100vh; color:#fff; padding:40px 20px}
    .back-btn{display:inline-block; margin-bottom:20px; color:#fff; text-decoration:none; background:rgba(255,255,255,0.2); padding:10px 20px; border-radius:50px}
    .container{max-width:900px; margin:0 auto; background:rgba(255,255,255,0.1); backdrop-filter:blur(12px); padding:30px; border-radius:20px; border:1px solid rgba(255,255,255,0.2)}
    h1{text-align:center; margin-bottom:10px}
    p.subtitle{text-align:center; opacity:0.8; margin-bottom:30px}
    textarea{width:100%; height:250px; padding:15px; border-radius:10px; border:none; font-size:1.1rem; margin-bottom:20px; outline:none; color:#000}
    .btns{display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-bottom:20px}
    button{padding:15px; border:none; border-radius:10px; background:#fff; color:#764ba2; font-size:1.1rem; font-weight:700; cursor:pointer; transition:0.3s}
    button:hover{transform:scale(1.02)}
    #output{background:rgba(0,0,0,0.3); padding:20px; border-radius:10px; margin-top:20px; min-height:250px; white-space:pre-wrap; font-size:1.1rem; line-height:1.6}
    .stats{display:flex; justify-content:space-between; margin-top:10px; font-size:0.9rem; opacity:0.8}
  </style>
</head>
<body>
  <a href="/" class="back-btn">← Back to Home</a>
  <div class="container">
    <h1>✍️ AI Grammar Checker + Paraphraser</h1>
    <p class="subtitle">Fix Grammar Mistakes & Make AI Text 100% Human</p>
    
    <textarea id="input" placeholder="Paste your text here... Example: i am going to market. it are very good."></textarea>
    
    <div class="btns">
      <button onclick="checkGrammar()">✅ Check Grammar</button>
      <button onclick="paraphrase()">🤖 Humanize Text</button>
    </div>
    
    <div id="output">Output will appear here...</div>
    <div class="stats">
      <span id="wordCount">Words: 0</span>
      <span id="charCount">Characters: 0</span>
    </div>
  </div>

  <script>
    // Word counter
    document.getElementById('input').addEventListener('input', function() {
      let text = this.value;
      document.getElementById('wordCount').innerText = 'Words: ' + text.trim().split(/\s+/).filter(Boolean).length;
      document.getElementById('charCount').innerText = 'Characters: ' + text.length;
    });

    function checkGrammar() {
      let text = document.getElementById('input').value;
      if(text.trim() === '') {alert('Please paste some text first'); return;}
      
      let fixed = text;
      // Common grammar fixes
      fixed = fixed.replace(/\bi\b/g, 'I');
      fixed = fixed.replace(/\bi'm\b/g, "I'm");
      fixed = fixed.replace(/your welcome/g, 'you are welcome');
      fixed = fixed.replace(/its a/g, "it's a");
      fixed = fixed.replace(/they is/g, 'they are');
      fixed = fixed.replace(/he are/g, 'he is');
      fixed = fixed.replace(/she are/g, 'she is');
      fixed = fixed.replace(/  +/g, '); // remove extra spaces
      fixed = fixed.replace(/\. +/g, '. '); // fix spacing after dot
      fixed = fixed.charAt(0).toUpperCase() + fixed.slice(1); // Capital first letter

      document.getElementById('output').innerText = "✅ Grammar Fixed Version:\n\n" + fixed;
    }
    
    function paraphrase() {
      let text = document.getElementById('input').value;
      if(text.trim() === '') {alert('Please paste some text first'); return;}
      
      let human = text;
      // AI to Human words
      const replacements = {
        'Furthermore': 'Also',
        'Moreover': 'Plus',
        'In conclusion': 'So',
        'Utilize': 'Use',
        'Therefore': 'So',
        'However,': 'But',
        'Additionally': 'Also',
        'Subsequently': 'Then',
        'Implement': 'Do',
        'Assistance': 'Help'
      };
      
      for(let [ai, humanWord] of Object.entries(replacements)) {
        human = human.replace(new RegExp(ai, 'g'), humanWord);
      }
      
      human = human.replace(/  +/g, ' ');
      
      document.getElementById('output').innerText = "🤖 Humanized Version:\n\n" + human + "\n\nNote: For best results, edit it once manually.";
    }
  </script>
</body>
</html>
